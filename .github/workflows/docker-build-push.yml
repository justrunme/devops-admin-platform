name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [ui, api, agent]
    env:
      REGISTRY: ghcr.io
      SHORT_SHA: ${{ github.sha }}
      PUSH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image coordinates
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ github.repository }}/${{ matrix.component }}"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${SHORT_SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: ${{ env.PUSH_IMAGES == 'true' }}
          sbom: ${{ env.PUSH_IMAGES == 'true' }}
          cache-from: type=gha
          cache-to: ${{ env.PUSH_IMAGES == 'true' && 'type=gha,mode=max' || '' }}

      - name: Generate SBOM
        if: env.PUSH_IMAGES == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: ${{ matrix.component }}-sbom.spdx.json
          output-file: ${{ matrix.component }}-sbom.spdx.json
          upload-artifact: true

      - name: Install cosign
        if: env.PUSH_IMAGES == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest build provenance
        if: env.PUSH_IMAGES == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign container image
        if: env.PUSH_IMAGES == 'true'
        run: cosign sign --yes --registry-referrers-mode=legacy "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Verify signed image
        if: env.PUSH_IMAGES == 'true'
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  update-tags:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHORT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update image tags
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          for chart in charts/ui charts/api charts/agent; do
            sed -i "s|tag: .*|tag: ${SHORT_SHA}|" "$chart/values.yaml"
          done
          sed -i "/name: devops-admin-platform-ui/,/newTag:/s/newTag: .*/newTag: ${SHORT_SHA}/" infra/k8s/base/kustomization.yaml
          sed -i "/name: devops-admin-platform-api/,/newTag:/s/newTag: .*/newTag: ${SHORT_SHA}/" infra/k8s/base/kustomization.yaml
          sed -i "/name: devops-admin-platform-agent/,/newTag:/s/newTag: .*/newTag: ${SHORT_SHA}/" infra/k8s/base/kustomization.yaml

      - name: Commit & Push updated tags
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/*/values.yaml infra/k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "ci: update image tags to ${SHORT_SHA}"
            git push origin main
          fi
