name: Terraform Platform Deployment Test

on:
  push:
    branches: [main, 'chore/maintenance-2026-10']
  pull_request:

permissions:
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TF_INPUT: false
      TF_IN_AUTOMATION: true
      TF_VAR_repo_url: https://github.com/justrunme/devops-admin-platform.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: devops-platform
          wait: 120s

      - name: Sync kubeconfig for Terraform
        run: |
          mkdir -p "$HOME/.kube"
          kind get kubeconfig --name devops-platform > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
          kubectl get nodes

      - name: Add Helm repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add argoproj https://argoproj.github.io/argo-helm
          helm repo add jetstack https://charts.jetstack.io
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Install CRDs before plan
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.crds.yaml
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/crds/application-crd.yaml
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/crds/appproject-crd.yaml
          kubectl wait --for condition=Established crd/clusterissuers.cert-manager.io --timeout=300s
          kubectl wait --for condition=Established crd/certificaterequests.cert-manager.io --timeout=300s
          kubectl wait --for condition=Established crd/applications.argoproj.io --timeout=300s
          kubectl wait --for condition=Established crd/appprojects.argoproj.io --timeout=300s

      - name: Terraform Init
        run: cd terraform && terraform init -input=false

      - name: Terraform Validate
        run: cd terraform && terraform validate

      - name: Terraform Plan
        run: cd terraform && terraform plan -input=false

      - name: Terraform Apply CRDs
        run: |
          cd terraform
          terraform apply -auto-approve -input=false \
            -target=null_resource.install_cert_manager_crds \
            -target=null_resource.install_argocd_crds

      - name: Wait for CRDs to be Established
        run: |
          kubectl wait --for condition=Established crd/clusterissuers.cert-manager.io --timeout=300s
          kubectl wait --for condition=Established crd/certificaterequests.cert-manager.io --timeout=300s
          kubectl wait --for condition=Established crd/applications.argoproj.io --timeout=300s

      - name: Terraform Apply platform dependencies
        run: |
          cd terraform
          terraform apply -auto-approve -input=false \
            -target=helm_release.cert_manager \
            -target=helm_release.ingress_nginx \
            -target=helm_release.redis \
            -target=helm_release.postgresql

      - name: Wait for ingress admission webhook
        run: |
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=180s
          for _ in $(seq 1 30); do
            if kubectl get validatingwebhookconfiguration ingress-nginx-admission >/dev/null 2>&1; then
              echo "ingress admission webhook is registered"
              exit 0
            fi
            sleep 2
          done
          echo "ingress admission webhook not found" >&2
          exit 1

      - name: Terraform Apply apps and GitOps
        run: |
          cd terraform
          terraform apply -auto-approve -input=false \
            -target=helm_release.argocd \
            -target=helm_release.api \
            -target=helm_release.ui \
            -target=helm_release.agent

      - name: Terraform Apply monitoring
        run: |
          cd terraform
          terraform apply -auto-approve -input=false \
            -target=helm_release.kube_prometheus \
            -target=helm_release.loki

      - name: Terraform Apply Manifests
        run: |
          cd terraform
          terraform apply -auto-approve -input=false \
            -target=kubernetes_manifest.letsencrypt_staging_cluster_issuer \
            -target=kubernetes_manifest.argocd_app

      - name: Verify ArgoCD Application
        run: |
          kubectl get application -n argocd devops-platform
          kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=180s

      - name: Check Pods Health
        run: |
          kubectl get pods -A
          kubectl get deployment -A
          kubectl rollout status deployment/ui --timeout=180s
          kubectl rollout status deployment/api --timeout=180s
          kubectl rollout status deployment/agent --timeout=180s

      - name: Verify HTTP endpoints
        run: |
          kubectl port-forward svc/ui 3000:3000 &
          kubectl port-forward svc/api 8080:8080 &
          sleep 10
          curl -fsS http://localhost:3000
          curl -fsS http://localhost:8080/api/status
          curl -fsS http://localhost:8080/health
