version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: monthly
    groups:
      go-api:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: monthly
    groups:
      go-agent:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      npm-ui:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    groups:
      docker-api:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /ui
    schedule:
      interval: monthly
    groups:
      docker-ui:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: monthly
    groups:
      docker-agent:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
